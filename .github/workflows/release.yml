# Use https://app.stepsecurity.io/ to improve workflow security
name: Create Release

on:
  push:
    tags: [ "v*.*.*" ]

env:
  RELEASE: yes

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/go.yml
    name: Go Tests

  create_release:
    name: Create Release
    needs: [tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # For creating release
    steps:
    - name: Ensure GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
          echo "Release $TAG already exists — reusing"
        else
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "Release $TAG" \
            --prerelease
        fi

  publish:
    name: Publish
    needs: [tests, create_release]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-latest
            arch: arm64
          - runner: macos-latest
            arch: arm64
          - runner: windows-latest
            arch: amd64
    permissions:
      contents: write  # For uploading release assets
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: false
      id: go

    - name: Setup Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libwayland-dev libxkbcommon-dev xorg-dev

    - name: Setup Windows Dependencies
      if: runner.os == 'Windows'
      run: |
        choco install -y make mingw

    - name: Install Fyne
      run: make setup-webui

    - name: Distribute
      run: make dist
      env:
        ARCH: ${{ matrix.arch }}

    - name: Upload Linux Binary
      if: runner.os == 'Linux'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
        ARCH: ${{ matrix.arch }}
        REPO: ${{ github.repository }}
      run: gh release upload "$TAG" "./bin/watchman-linux-$ARCH" --repo "$REPO" --clobber

    - name: Upload macOS Binary
      if: runner.os == 'macOS'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
        ARCH: ${{ matrix.arch }}
        REPO: ${{ github.repository }}
      run: gh release upload "$TAG" "./bin/watchman-darwin-$ARCH" --repo "$REPO" --clobber

    - name: Upload Windows Binary
      if: runner.os == 'Windows'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      run: gh release upload "$TAG" "./bin/watchman.exe" --repo "$REPO" --clobber

  docker-hub:
    name: Docker Hub (${{ matrix.platform }})
    needs: [tests, create_release]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: false
      id: go

    - name: Clean
      run: make clean

    - name: Build Web UI
      run: |
        make setup-webui
        make build-webui

    - name: Docker Hub
      run: make docker-hub
      env:
        ARCH: ${{ matrix.arch }}

    - name: Login to Docker Hub
      if: ${{ env.DOCKER_USERNAME != '' }}
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Docker Hub Push
      if: ${{ env.DOCKER_USERNAME != '' }}
      run: make docker-hub-push
      env:
        ARCH: ${{ matrix.arch }}

  docker-hub-manifest:
    name: Docker Hub Manifest
    needs: [docker-hub]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: false
      id: go

    - name: Login to Docker Hub
      if: ${{ env.DOCKER_USERNAME != '' }}
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Docker Manifest
      if: ${{ env.DOCKER_USERNAME != '' }}
      run: make docker-hub-manifest

  docker-openshift:
    name: Docker Openshift (${{ matrix.platform }})
    needs: [tests, create_release]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      DOCKER_USERNAME: ${{ secrets.QUAY_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: false
      id: go

    - name: Clean
      run: make clean

    - name: Build Web UI
      run: |
        make setup-webui
        make build-webui

    - name: Docker Openshift
      run: make docker-openshift
      env:
        ARCH: ${{ matrix.arch }}

    - name: Quay.io Push
      if: ${{ env.DOCKER_USERNAME != '' }}
      run: |
        echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin quay.io
        make docker-openshift-push
      env:
        ARCH: ${{ matrix.arch }}

  docker-openshift-manifest:
    name: Docker Openshift Manifest
    needs: [docker-openshift]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKER_USERNAME: ${{ secrets.QUAY_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: false
      id: go

    - name: Quay.io Manifest
      if: ${{ env.DOCKER_USERNAME != '' }}
      run: |
        echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin quay.io
        make docker-openshift-manifest
