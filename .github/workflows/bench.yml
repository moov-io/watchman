# Use https://app.stepsecurity.io/ to improve workflow security
name: Benchmarks
on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions: {}

jobs:
  bench:
    name: Run
    if: github.repository == 'moov-io/watchman'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      deployments: write
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 50

    - name: Setup Linux Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libwayland-dev libxkbcommon-dev xorg-dev

    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
      id: go

    - name: Should Run Benchmarks
      id: should_run_benchmarks
      run: |
        # Skip only the bot's own "benchmark result" commits. Renovate and
        # other .github.com authors are code changes and should still run.
        if git log -1 --format=%s | grep -q 'benchmark result'; then
          echo "should_run=false" >> "$GITHUB_OUTPUT"
        else
          echo "should_run=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Resolve code commit
      id: meta
      run: |
        sha=$(git log -1 --format=%H --invert-grep --grep='benchmark result' || true)
        if [ -z "${sha}" ]; then
          sha="${GITHUB_SHA}"
        fi
        echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

    - name: Ensure bench-data branch
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/bench-data" >/dev/null 2>&1; then
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/bench-data" -f sha="${GITHUB_SHA}"
        fi

    - name: Running Common Benchmarks
      if: steps.should_run_benchmarks.outputs.should_run == 'true'
      run: |
        go test ./pkg/search/... -short -bench BenchmarkDebugSimilarity -run '^$' -benchmem > output.txt
        go test ./internal/search/... -short -bench Benchmark_Search/dynamic -run '^$' -benchmem >> output.txt
        go test ./internal/search/... -short -bench Benchmark_SearchDebug -run '^$' -benchmem >> output.txt
        go test ./internal/search/... -short -bench BenchmarkAPI_Search -run '^$' -benchmem >> output.txt
        go test ./internal/stringscore/... -short -bench Benchmark -run '^$' -benchmem >> output.txt
        go test ./internal/postalpool/... -short -bench BenchmarkPostalPool -run '^$' -benchmem >> output.txt
        go test ./internal/norm/... -short -bench Bench -run '^$' -benchmem >> output.txt

    - name: Show Common results
      if: steps.should_run_benchmarks.outputs.should_run == 'true'
      run: cat output.txt

    - name: Store benchmark result
      if: steps.should_run_benchmarks.outputs.should_run == 'true'
      uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
      with:
        name: "moov-io/watchman Common Benchmarks"
        tool: 'go'
        output-file-path: "./output.txt"
        github-token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ steps.meta.outputs.sha }}
        skip-fetch-gh-pages: false
        auto-push: true
        alert-threshold: '120%'
        comment-on-alert: true
        fail-on-alert: false
        summary-always: true
        alert-comment-cc-users: '@adamdecaf'
        max-items-in-chart: 25
        gh-pages-branch: bench-data
        benchmark-data-dir-path: "docs/bench/common/"

    - name: Running OFAC Benchmarks
      if: steps.should_run_benchmarks.outputs.should_run == 'true'
      run: |
        go test ./pkg/sources/ofac/... -short -bench Benchmark -run '^$' -benchmem > output.txt

    - name: Show OFAC results
      if: steps.should_run_benchmarks.outputs.should_run == 'true'
      run: cat output.txt

    - name: Store OFAC results
      if: steps.should_run_benchmarks.outputs.should_run == 'true'
      uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
      with:
        name: "moov-io/watchman OFAC Benchmarks"
        tool: 'go'
        output-file-path: "./output.txt"
        github-token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ steps.meta.outputs.sha }}
        skip-fetch-gh-pages: false
        auto-push: true
        alert-threshold: '120%'
        comment-on-alert: true
        fail-on-alert: false
        summary-always: true
        alert-comment-cc-users: '@adamdecaf'
        max-items-in-chart: 25
        gh-pages-branch: bench-data
        benchmark-data-dir-path: "docs/bench/sources/ofac/"

    - name: Running CSL US Benchmarks
      if: steps.should_run_benchmarks.outputs.should_run == 'true'
      run: |
        go test ./pkg/sources/csl_us/... -short -bench Benchmark -run '^$' -benchmem > output.txt

    - name: Show CSL US results
      if: steps.should_run_benchmarks.outputs.should_run == 'true'
      run: cat output.txt

    - name: Store CSL US results
      if: steps.should_run_benchmarks.outputs.should_run == 'true'
      uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
      with:
        name: "moov-io/watchman CSL US Benchmarks"
        tool: 'go'
        output-file-path: "./output.txt"
        github-token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ steps.meta.outputs.sha }}
        skip-fetch-gh-pages: false
        auto-push: true
        alert-threshold: '120%'
        comment-on-alert: true
        fail-on-alert: false
        summary-always: true
        alert-comment-cc-users: '@adamdecaf'
        max-items-in-chart: 25
        gh-pages-branch: bench-data
        benchmark-data-dir-path: "docs/bench/sources/csl_us/"

    - name: Logs
      if: failure()
      run: cat output.txt || true

